[project]
name = "pairly"
version = "0.1.0"
description = "Python client for the Pairly API: human-approved AI for hiring and accounts payable."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Proofly Technology" }]
keywords = ["pairly", "human-in-the-loop", "approvals", "accounts-payable", "hiring", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
# One runtime dependency: the webhook helpers are standard library only.
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly"]
