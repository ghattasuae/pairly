#
# Who approves a drafted message about an invoice exception, version 1 (brief 4.5.4):
# one AP clerk or finance controller who did not write it (the engine makes the
# submitter a preparer, so they never approve their own message).
schema: pairly.approval_rules/v1
approval_type: pay.message
sla_hours: 24
warn_hours: 4
chains:
  - name: review
    steps:
      - {name: reviewer, mode: any_of, roles: [ap_clerk, finance_controller]}
