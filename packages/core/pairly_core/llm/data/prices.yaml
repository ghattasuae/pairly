#
# Model price table for the model router (pairly_core.llm.catalog).
# Prices are USD per million tokens, standard tier, global routing, no batch discount.
# Strings, not floats, so the values are exact.
#
# Change process: add or edit a model, bump `version` (date of the change), update the
# `retrieved` date of the source you checked. Never hardcode a price in code.
# Calls already stored keep the cost computed when they ran.

version: "2026-10-07"
currency: USD
unit: per_million_tokens

sources:
  anthropic:
    url: https://platform.claude.com/docs/en/about-claude/pricing
    retrieved: "2026-10-07"
  openai:
    url: https://developers.openai.com/api/docs/pricing
    retrieved: "2026-10-07"

models:
  # Anthropic. cache_write is the 5-minute cache write price.
  claude-haiku-4-5-20251001:
    provider: anthropic
    input: "1.00"
    output: "5.00"
    cache_read: "0.10"
    cache_write: "1.25"
  claude-haiku-4-5:
    provider: anthropic
    input: "1.00"
    output: "5.00"
    cache_read: "0.10"
    cache_write: "1.25"
  claude-sonnet-5-5:
    provider: anthropic
    input: "2.00"
    output: "10.00"
    cache_read: "0.20"
    cache_write: "2.50"
  claude-sonnet-5:
    provider: anthropic
    input: "2.00"
    output: "10.00"
    cache_read: "0.20"
    cache_write: "2.50"
  claude-opus-5-5:
    provider: anthropic
    input: "4.00"
    output: "20.00"
    cache_read: "0.20"
    cache_write: "5.00"

  # OpenAI. No separate cache write charge, so cache_write equals input.
  gpt-6-luna:
    provider: openai
    input: "0.10"
    output: "0.50"
    cache_read: "0.01"
    cache_write: "0.10"
  gpt-6.1-sol:
    provider: openai
    input: "2.00"
    output: "10.00"
    cache_read: "0.10"
    cache_write: "2.00"
  gpt-6-astra:
    provider: openai
    input: "10.00"
    output: "50.00"
    cache_read: "1.00"
    cache_write: "10.00"
  # Embeddings (ModelRouter.embed, task core_embed): input tokens only.
  text-embedding-3-small:
    provider: openai
    input: "0.02"
    output: "0.00"
    cache_read: "0.00"
    cache_write: "0.00"
