[project]
name = "pairly-core"
version = "0.0.0"
description = "Pairly core engine: workflow-agnostic ingestion, extraction, policy, approvals and audit."
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-Proofly-Commercial"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Proofly Technology" }]
dependencies = [
    "anthropic>=1.11,<2",
    "arabic-reshaper>=3.0",
    "arq>=0.28,<0.29",
    "asyncpg>=0.30",
    "boto3>=1.35",
    # AES-256-GCM field encryption (pairly_core.crypto). Apache-2.0 or BSD-3-Clause.
    "cryptography>=44",
    "defusedxml>=0.7.1",
    "fastapi>=0.121",
    "httpx>=0.28",
    # Notification templates (SandboxedEnvironment). BSD-3-Clause.
    "jinja2>=3.1.6",
    "langfuse>=4.17,<6",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "openai>=3.26,<4",
    "opentelemetry-api>=1.45",
    "pdfplumber>=0.11.4",
    "pillow>=11.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[tool.uv.sources]
pairly-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly_core"]
