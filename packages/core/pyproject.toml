[project]
name = "pairly-core"
version = "0.0.0"
description = "Pairly core engine: workflow-agnostic ingestion, extraction, policy, approvals and audit."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Proofly Technology" }]
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.121",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[tool.uv.sources]
pairly-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly_core"]
