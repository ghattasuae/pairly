#
# Who decides a screening, version 1. Every application goes to a person: approving
# shortlists the candidate, rejecting means not shortlisted, and "changes requested"
# returns the screening for another look. Nothing is decided by the AI.
schema: pairly.approval_rules/v1
approval_type: hire.screening
sla_hours: 120
warn_hours: 24
escalation:
  roles: [recruiter]
chains:
  - name: screening
    steps:
      - {name: reviewer, mode: any_of, roles: [recruiter, hiring_manager]}
