[project]
name = "pairly-hire"
version = "0.0.0"
description = "Pairly Hire workflow plugin."
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-Proofly-Commercial"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Proofly Technology" }]
dependencies = ["pairly-core", "pairly-api", "httpx>=0.28", "pyyaml>=6.0"]

[project.entry-points."pairly.workflows"]
hire = "pairly_hire.plugin:plugin"

[tool.uv.sources]
pairly-core = { workspace = true }
pairly-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly_hire"]
