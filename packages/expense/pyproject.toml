[project]
name = "pairly-expense"
version = "0.0.0"
description = "Pairly expense notes: the small example workflow (M1 acceptance, add-a-workflow guide)."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Proofly Technology" }]
dependencies = ["pairly-core", "pairly-api"]

[project.entry-points."pairly.workflows"]
expense = "pairly_expense.plugin:plugin"

[tool.uv.sources]
pairly-core = { workspace = true }
pairly-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly_expense"]
