#
# Hosted demo web app (docs/hosted-demo.md): Next.js from infra/docker/web.Dockerfile,
# Better Auth as pairly_auth (its schema only: auth on pairly-demo-db, pairly_auth on
# Supabase, PAIRLY_AUTH_DB_SCHEMA). Public at https://pairly-demo-web.fly.dev.
# Visitors sign in at /en/demo (or /ar/demo) as a seeded demo user: no email is sent and
# no mailbox is shown (PAIRLY_DEMO_PUBLIC_SIGNIN, apps/web/src/lib/demo/policy.ts).
#
# Secrets (from scripts/gen_dev_env.py --fly): BETTER_AUTH_SECRET,
# PAIRLY_AUTH_DATABASE_URL.
#
#   fly deploy . --config infra/fly/web/fly.toml --dockerfile infra/docker/web.Dockerfile --ha=false
#
# Database on Supabase instead of pairly-demo-db (docs/hosted-demo.md): the secrets from
# scripts/gen_dev_env.py --fly DIR --supabase REF --supabase-pooler HOST carry the session
# pooler URL (sslmode=require&uselibpqcompat=true) and PAIRLY_AUTH_DB_SCHEMA=pairly_auth
# (secrets override [env]). To verify the server certificate, store Supabase's CA as a
# secret (SUPABASE_CA_CERT, base64), uncomment the [[files]] block below, set
# NODE_EXTRA_CA_CERTS=/etc/pairly/supabase-ca.crt and use sslmode=verify-full alone.
app = "pairly-demo-web"
primary_region = "fra"

[build]
  # From the repository root, the build context (run fly deploy from there).
  dockerfile = "infra/docker/web.Dockerfile"

[env]
  NODE_ENV = "production"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"
  PAIRLY_ENV = "staging"
  BETTER_AUTH_URL = "https://pairly-demo-web.fly.dev"
  PAIRLY_AUTH_ISSUER = "https://pairly-demo-web.fly.dev"
  PAIRLY_AUTH_AUDIENCE = "https://pairly-demo-web.fly.dev"
  PAIRLY_AUTH_MIGRATE_ON_START = "true"
  PAIRLY_API_INTERNAL_URL = "https://pairly-demo-api.fly.dev"
  # Signed document URLs point at Tigris; the page CSP allows that origin only.
  PAIRLY_DOCUMENT_ORIGIN = "https://fly.storage.tigris.dev"
  # Sends nothing (refused when PAIRLY_ENV is production).
  PAIRLY_EMAIL_TRANSPORT = "fake"
  PAIRLY_DEMO_PUBLIC_SIGNIN = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/api/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Supabase only, see the header:
# [[files]]
#   guest_path = "/etc/pairly/supabase-ca.crt"
#   secret_name = "SUPABASE_CA_CERT"
