#
# Hosted demo jobs (docs/hosted-demo.md): migrations, the first seed and the nightly
# reset (scripts/hosted_demo.py), from the `demo` target of infra/docker/python.Dockerfile.
# No Machine runs all the time: the image is built and pushed once per release, then
# run as one-off Machines (`fly machine run ... --rm`) and as one scheduled Machine
# (`--schedule daily`). The only app that holds the owner role's database password.
#
# Why not a release_command for the seed: a release command runs before the new
# version starts, with no volumes and a 5 minute default timeout, while the seed needs
# the API, the worker and the web app up (it applies through the careers API and waits
# for the worker to screen the CVs). Migrations do not need a release command either:
# `hosted_demo.py reset` migrates, and `hosted_demo.py migrate` runs before a deploy.
#
# Secrets (from scripts/gen_dev_env.py --fly): PAIRLY_DATABASE_URL_OWNER,
# PAIRLY_DATABASE_URL, PAIRLY_AUTH_DATABASE_URL, the encryption keys, the pepper, the
# signed link secret, PAIRLY_AUDIT_ANCHOR_PUBLIC_KEY; by hand: PAIRLY_REDIS_URL,
# PAIRLY_S3_ACCESS_KEY, PAIRLY_S3_SECRET_KEY.
#
#   fly deploy . --config infra/fly/ops/fly.toml --dockerfile infra/docker/python.Dockerfile \
#     --build-target demo --build-only --push --image-label demo

app = "pairly-demo-ops"
primary_region = "fra"

[build]
  dockerfile = "infra/docker/python.Dockerfile"
  build-target = "demo"

[env]
  PAIRLY_ENV = "staging"
  PAIRLY_LOG_LEVEL = "INFO"
  # Recorded model mode: answers come from the committed recordings, no API key, no spend.
  PAIRLY_MODEL_MODE = "recorded"
  PAIRLY_PUBLIC_API_URL = "https://pairly-demo-api.fly.dev"
  PAIRLY_PUBLIC_WEB_URL = "https://pairly-demo-web.fly.dev"
  PAIRLY_AUTH_JWKS_URL = "https://pairly-demo-web.fly.dev/api/auth/jwks"
  PAIRLY_AUTH_ISSUER = "https://pairly-demo-web.fly.dev"
  PAIRLY_AUTH_AUDIENCE = "https://pairly-demo-web.fly.dev"
  PAIRLY_CORS_ORIGINS = "https://pairly-demo-web.fly.dev"
  # Tigris (Fly's S3-compatible store). Path-style requests; one access key for both
  # buckets (docs/hosted-demo.md, step 5).
  PAIRLY_S3_ENDPOINT_URL = "https://fly.storage.tigris.dev"
  PAIRLY_S3_PUBLIC_ENDPOINT_URL = "https://fly.storage.tigris.dev"
  PAIRLY_S3_REGION = "auto"
  PAIRLY_S3_BUCKET = "pairly-demo-documents"
  PAIRLY_AUDIT_ANCHOR_BUCKET = "pairly-demo-anchors"
  # Tigris documents no S3 Object Lock, so anchors keep two of their three write-once
  # layers (conditional put, no delete in Pairly). The gap is in docs/hosted-demo.md.
  PAIRLY_AUDIT_ANCHOR_LOCK_MODE = "none"
  PAIRLY_CLAMAV_HOST = "pairly-demo-clamav.flycast"
  PAIRLY_CLAMAV_PORT = "3310"
  # Nothing is emailed from the demo: visitors sign in on /<locale>/demo.
  PAIRLY_EMAIL_TRANSPORT = "fake"
  PAIRLY_KEK_CURRENT = "1"
  PAIRLY_BLIND_INDEX_KEY_CURRENT = "1"
  PAIRLY_DEMO_PUBLIC_SIGNIN = "true"
  PAIRLY_DEMO_ORG_SLUG = "demo"
  # The web app only sends Cloudflare's documented test token (no Turnstile widget yet),
  # so the API checks it with Cloudflare's documented always-pass test secret: a public
  # test value, not a secret. The demo careers form has no real bot protection; the
  # careers rate limits and the nightly reset still apply. See the doc.
  PAIRLY_HIRE_TURNSTILE = "cloudflare"
  PAIRLY_HIRE_TURNSTILE_SECRET = "1x0000000000000000000000000000000AA"
  # Tighter limits for the demo deployment (it serves the demo organisation only).
  PAIRLY_API_KEY_RATE_LIMIT_PER_MINUTE = "60"
  PAIRLY_API_KEY_MAX_DAYS = "7"
  PAIRLY_BATCH_ITEMS_PER_MINUTE = "20"
  PAIRLY_MAX_UPLOAD_BYTES = "5242880"
  PAIRLY_INTAKE_DEFAULT_MAX_BYTES = "5242880"
  PAIRLY_SIGNED_URL_TTL_SECONDS = "60"
  PAIRLY_PARSE_CONCURRENCY = "1"
  PAIRLY_PARSE_MEMORY_MB = "512"
  PAIRLY_OCR_LANGUAGES = "eng+ara"
  PAIRLY_HOSTED_DEMO = "1"
  # reset refuses unless this is the database in PAIRLY_DATABASE_URL_OWNER.
  PAIRLY_HOSTED_DEMO_DATABASE = "pairly"
