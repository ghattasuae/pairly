# CLA Assistant: asks every contributor to sign CLA.md on their first pull request
# and sets a failing status until they do. Make this check required in branch
# protection for `main` so unsigned pull requests cannot merge.
#
# Before first use on GitHub:
#   1. Create the `cla-signatures` branch (signatures are stored there, not on `main`).
#   2. TODO: replace ghattasuae in path-to-document once the GitHub organisation is decided.
#   3. TODO: legal review of CLA.md before the first external contribution.
#
# Security: pull_request_target runs with write access, so this workflow must never
# check out or run code from the pull request. The action only reads PR metadata and comments.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # v2.6.1, pinned to the commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ghattasuae/pairly/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Pairly is open source (AGPL-3.0) with a commercial
            license option, so we ask every contributor to sign our
            [Contributor License Agreement](https://github.com/ghattasuae/pairly/blob/main/CLA.md)
            once. You keep your copyright. CONTRIBUTING.md explains why we need it.
            To sign, reply to this pull request with the sentence below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
