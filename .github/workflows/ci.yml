# Copyright (c) 2026 Proofly Technology
#
# Main CI. The single required status check for `main` is the `ci-ok` job, which
# passes only when every other job passed (see docs/ci.md for branch protection).
#
# Security rules for this file:
#   - Read-only token everywhere (permissions: contents: read). No job needs more.
#   - Every third-party action is pinned to a full commit SHA, with the tag in a comment.
#     Dependabot (github-actions ecosystem) proposes updates.
#   - Checkouts do not persist the token (persist-credentials: false).
#   - Only `pull_request` is used, never `pull_request_target`, so fork code never sees
#     secrets or a write token.
#   - Downloaded tool binaries are verified against pinned SHA-256 hashes
#     (scripts/ci_tools.sh).
#
# Run the same checks locally: make lint typecheck test ci-licenses ci-security ci-actionlint
# (one pytest shard as CI runs it: make local-test-shard SHARD=api-1, see scripts/ci_shards.py)

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash -eo pipefail
    shell: bash

env:
  # Never re-resolve the lockfile in CI; fail if uv.lock is out of date.
  UV_VERSION: "0.9.28"
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_COLOR: "1"

jobs:
  # ------------------------------------------------------------------ python
  python:
    name: python (lint, types, migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --all-packages --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: import contracts
        run: uv run lint-imports

      - name: mypy (strict on packages/core, packages/expense, packages/hire and packages/pay)
        run: uv run mypy packages/core packages/expense packages/hire packages/pay

      - name: mypy (everything else)
        run: uv run mypy apps sdks/python scripts synth evals

      - name: Start Postgres (roles from infra/postgres/init)
        env:
          CI_PG_PORT: "5432"
        run: scripts/ci_postgres.sh start

      - name: alembic upgrade heads
        run: uv run alembic -c apps/api/alembic.ini upgrade heads

      # Fails when the ORM models and the migrated schema disagree (a missing migration).
      - name: alembic check
        run: uv run alembic -c apps/api/alembic.ini check

      - name: Stop Postgres
        if: always()
        run: scripts/ci_postgres.sh stop

  # ------------------------------------------------------------------ python tests
  python-tests:
    # The suite in parallel shards (scripts/ci_shards.py owns the split; a test checks
    # that every test file is in exactly one shard and that this matrix lists every
    # shard). Each shard has its own Postgres. Coverage is gated on the combined data in
    # the `coverage` job, never per shard.
    name: python tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - packages
          - api-hire-1
          - api-hire-2
          - api-pay-1
          - api-pay-2
          - api-1
          - api-2
          - api-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The packages shard runs scripts/tests, which checks that the commit named in
          # the README stats exists; that commit is an ancestor of HEAD, so this shard
          # fetches the full history (the other shards keep the shallow default). The
          # depths are strings because the number 0 is falsy in an expression.
          fetch-depth: ${{ matrix.shard == 'packages' && '0' || '1' }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --all-packages --locked

      # OCR tests (pairly_core.documents.ocr) need the tesseract binary and language data.
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara

      - name: Start Postgres (roles from infra/postgres/init)
        env:
          CI_PG_PORT: "5432"
        run: scripts/ci_postgres.sh start

      - name: pytest with coverage (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE_FILE: coverage-data/${{ matrix.shard }}.coverage
        run: |
          mkdir -p coverage-data
          mapfile -t files < <(uv run python scripts/ci_shards.py files "$SHARD")
          echo "shard $SHARD: ${#files[@]} test files"
          set +e
          # The coverage gate applies to the combined data (job `coverage`), not per shard.
          uv run pytest --cov --cov-report= --cov-fail-under=0 -rs "${files[@]}" 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          # Fail closed: tests that need the database or tesseract must run in CI,
          # never skip silently.
          if grep -Eq "database tests need|migration round trip needs|needs PAIRLY_TEST_DATABASE_URL_OWNER|tesseract not installed" pytest.log; then
            echo "::error::tests were skipped because the test database env or tesseract is missing"
            exit 1
          fi
          exit "$status"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-data/${{ matrix.shard }}.coverage
          if-no-files-found: error
          retention-days: 1

      - name: Stop Postgres
        if: always()
        run: scripts/ci_postgres.sh stop

  # ------------------------------------------------------------------ coverage
  coverage:
    # Combines the coverage data of every shard and enforces `fail_under` from
    # pyproject.toml on the whole suite, on every pull request.
    name: python coverage (combined gate)
    needs: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --all-packages --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine and enforce the coverage threshold
        run: |
          # Fail closed: every shard's data must be here, or the gate would measure less.
          mapfile -t expected < <(uv run python scripts/ci_shards.py list)
          for shard in "${expected[@]}"; do
            if [ ! -f "coverage-data/$shard.coverage" ]; then
              echo "::error::coverage data of shard $shard is missing"
              exit 1
            fi
          done
          uv run coverage combine coverage-data/*.coverage
          uv run coverage xml
          uv run coverage report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------ js
  js:
    name: js (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: Build workspace libraries
        # Libraries first, so typecheck and the web build see their emitted types.
        run: pnpm -r --filter '!@pairly/web' --if-present build

      - name: typecheck
        run: pnpm typecheck

      - name: vitest (root)
        run: pnpm test

      - name: vitest (workspace packages)
        run: pnpm -r --if-present test

      - name: "@pairly/sdk installs and imports on its own (packed tarball, fresh project)"
        run: pnpm --filter @pairly/sdk pack:check

      - name: Storybook build and smoke render of every story
        run: |
          pnpm --filter @pairly/web exec playwright install --with-deps chromium
          pnpm test:storybook

      - name: Detect the Next.js app
        id: web
        # apps/web becomes a Next.js app in WP0.6. Until then there is nothing to build.
        run: |
          if node -e '
            const p = require("./apps/web/package.json");
            const deps = { ...(p.dependencies || {}), ...(p.devDependencies || {}) };
            process.exit(p.scripts && p.scripts.build && deps.next ? 0 : 1);
          ' && { [ -d apps/web/app ] || [ -d apps/web/src/app ]; }; then
            echo "next=true" >>"$GITHUB_OUTPUT"
          else
            echo "next=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=web build skipped::apps/web is not a Next.js app yet (WP0.6), so the build step is skipped."
          fi

      - name: Build apps/web
        if: steps.web.outputs.next == 'true'
        run: pnpm --filter @pairly/web build

  # ------------------------------------------------------------------ text
  text:
    name: text (em dashes, SPDX headers, workflow lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both scripts use the standard library only, so the runner's Python 3.12 is enough.
      - name: No em dashes
        run: python3 scripts/check_no_em_dash.py

      - name: SPDX headers
        run: python3 scripts/spdx_headers.py --check

      - name: actionlint
        run: |
          actionlint="$(scripts/ci_tools.sh actionlint)"
          "$actionlint" -color

  # ------------------------------------------------------------------ security
  security:
    name: security (bandit, pip-audit, pnpm audit, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so gitleaks scans every commit, not only the last one.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bandit
        # Fails on medium or higher severity with medium or higher confidence.
        run: >-
          uvx --from bandit==1.9.4 bandit -c scripts/bandit.yaml
          --severity-level medium --confidence-level medium
          -r packages apps sdks/python scripts

      - name: pip-audit (locked Python dependencies)
        run: |
          uv export --all-packages --no-emit-workspace --format requirements.txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" \
            --disable-pip --require-hashes --progress-spinner off

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Threshold (docs/ci.md): production dependencies fail on high or critical;
      # dev-only dependencies fail on critical. Lower findings show in the log.
      - name: pnpm audit (production, high and above)
        run: pnpm audit --prod --audit-level high

      - name: pnpm audit (all, critical only)
        run: pnpm audit --audit-level critical

      - name: gitleaks (full git history)
        run: |
          gitleaks="$(scripts/ci_tools.sh gitleaks)"
          "$gitleaks" git --redact --no-banner --verbose .

  # ------------------------------------------------------------------ licenses
  licenses:
    name: licenses (AGPL compatibility gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile --ignore-scripts

      - name: License check
        run: uv run python scripts/check_licenses.py

  # ------------------------------------------------------------------ evals
  evals:
    # The eval runners (evals.guardrails_hire, evals.hire) and the gate (evals.gate):
    # a measured metric outside evals/thresholds.yaml fails the build (BRIEF rule 6).
    # No model API key in CI yet: model-dependent metrics are "pending_live_run",
    # listed by the gate and not gating. Part of `ci-ok`, so it gates merges.
    name: evals (merge gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --all-packages --locked

      - name: make evals
        run: make evals

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: |
            evals/results/
            evals/report.md
          if-no-files-found: ignore

  # ------------------------------------------------------------------ docker
  docker:
    name: docker (build python image, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build infra/docker/python.Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/python.Dockerfile
          push: false
          tags: pairly-ci/python-app:${{ github.sha }}
          cache-from: type=gha,scope=python-image
          cache-to: type=gha,mode=max,scope=python-image

  # ------------------------------------------------------------------ gate
  ci-ok:
    # The only required status check. Fails when any job failed, was cancelled or was
    # skipped, so adding a job here is enough to make it required.
    name: ci-ok
    if: always()
    needs: [python, python-tests, coverage, js, text, security, licenses, evals, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::at least one required job did not pass"
            exit 1
          fi
