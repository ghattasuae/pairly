name: Bug report
description: Something does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        **Security problems:** do not use this form. Report them privately as described in SECURITY.md.

        **Use synthetic data only.** Do not paste real CVs, invoices, names, email addresses or bank details.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core engine
        - Pairly Hire
        - Pairly Pay
        - Web app
        - API or SDK
        - MCP server
        - Install or docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in a few short sentences.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run make demo
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main at abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, Docker version, and anything else that may matter.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove any secrets or personal data first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no real personal data and no secrets.
          required: true
