#
# gitleaks settings, read by CI (`make ci-security`) and the pre-commit hook.
# Default rules plus narrow allowlists for proven false positives. Each entry must say
# why it is safe. Never allowlist a whole file or path to hide a real secret: rotate it.

title = "Pairly gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Type annotations such as `key: Ed25519PrivateKey`: the 'secret' is a class name"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(Ed25519|Ed448|X25519|RSA|EllipticCurve)(Private|Public)Key$''']

[[allowlists]]
description = """Synthetic SDK and MCP test fixtures, never real credentials: the fake API key \
prefix pk_test_abcd1234_ (its secret part is built at run time as "A" * 43) and the \
webhook test vector secret the TypeScript SDK test shares with the engine."""
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^pk_test_abcd1234_$''', '''^whsec_test_vector_secret_0123456789$''']
