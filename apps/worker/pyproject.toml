[project]
name = "pairly-worker"
version = "0.0.0"
description = "Pairly background worker and scheduled jobs."
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-Proofly-Commercial"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Proofly Technology" }]
dependencies = [
    "arq>=0.28,<0.29",
    "pairly-core",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[tool.uv.sources]
pairly-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly_worker"]
