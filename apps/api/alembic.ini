#
# Migrations run as the database owner role: PAIRLY_DATABASE_URL_OWNER.
# The application role named by PAIRLY_DB_APP_ROLE (default pairly_app) must already
# exist; migrations grant it DML only.
#
# Usage: uv run alembic -c apps/api/alembic.ini upgrade heads

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
