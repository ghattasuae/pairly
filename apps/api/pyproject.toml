[project]
name = "pairly-api"
version = "0.0.0"
description = "Pairly REST API service."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Proofly Technology" }]
dependencies = ["pairly-core"]

[tool.uv.sources]
pairly-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly_api"]
