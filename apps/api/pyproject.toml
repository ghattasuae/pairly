[project]
name = "pairly-api"
version = "0.0.0"
description = "Pairly REST API service."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Proofly Technology" }]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.121",
    "httpx>=0.28",
    "opentelemetry-api>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-sdk>=1.28",
    "pairly-core",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn>=0.32",
]

[project.scripts]
pairly-admin = "pairly_api.admin:main"

[tool.uv.sources]
pairly-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pairly_api"]
